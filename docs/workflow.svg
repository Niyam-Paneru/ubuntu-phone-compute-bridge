<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Ubuntu phone compute bridge</title><desc id="d">A Windows controller chooses a named job, sends it over a bounded bridge to phone Ubuntu, and validates the structured result.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">PHONE COMPUTE BRIDGE</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">The phone is a worker, not a mystery shell.</text>

<rect x="58" y="170" width="220" height="110" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="82" y="202" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">WINDOWS</text>
<text x="82" y="235" fill="#171714" font-family="Georgia,serif" font-size="24">Choose named job.</text>
<text x="82" y="263" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">no free-form command field</text>

<rect x="355" y="145" width="235" height="160" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="380" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">BRIDGE</text>
<text x="380" y="211" fill="#171714" font-family="Georgia,serif" font-size="24">Bounded transport.</text>
<text x="380" y="248" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">strict host identity</text>
<text x="380" y="273" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">small connection limits</text>

<rect x="665" y="145" width="235" height="160" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="690" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">PHONE UBUNTU</text>
<text x="690" y="211" fill="#171714" font-family="Georgia,serif" font-size="24">Run reviewed work.</text>
<text x="690" y="248" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">health</text>
<text x="750" y="248" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">smoke</text>
<text x="810" y="248" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">benchmark</text>

<rect x="975" y="170" width="170" height="110" rx="16" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="1000" y="202" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">RESULT</text>
<text x="1000" y="235" fill="#171714" font-family="Georgia,serif" font-size="22">Verify proof.</text>
<text x="1000" y="263" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">job · location · digest</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M278 225 H355"/><path d="M590 225 H665"/><path d="M900 225 H975"/></g>
<g fill="#171714"><path d="M347 219 l10 6 -10 6z"/><path d="M657 219 l10 6 -10 6z"/><path d="M967 219 l10 6 -10 6z"/></g>

<rect x="355" y="365" width="545" height="70" rx="14" fill="#262722"/>
<text x="380" y="394" fill="#d8d8d1" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">NO SILENT FALLBACK</text>
<text x="380" y="420" fill="#fff" font-family="Georgia,serif" font-size="19">If the phone fails, Windows does not pretend it succeeded.</text>
</svg>
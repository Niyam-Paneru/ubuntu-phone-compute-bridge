<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Ubuntu phone compute workflow</title>
<desc id="d">A Windows controller selects a named job, an attended phone worker runs it, and the structured result is verified.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">The phone is a worker, not a mystery box.</text>
<g font-family="Arial,sans-serif">
  <rect x="60" y="125" width="220" height="92" rx="18" fill="#111827" stroke="#60a5fa" stroke-width="3"/>
  <text x="170" y="160" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="700">Windows</text>
  <text x="170" y="190" text-anchor="middle" fill="#94a3b8" font-size="14">choose named job</text>

  <rect x="350" y="125" width="220" height="92" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <text x="460" y="160" text-anchor="middle" fill="#e0f2fe" font-size="20" font-weight="700">attended link</text>
  <text x="460" y="190" text-anchor="middle" fill="#94a3b8" font-size="14">bounded transport</text>

  <rect x="640" y="125" width="220" height="92" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
  <text x="750" y="160" text-anchor="middle" fill="#ede9fe" font-size="20" font-weight="700">phone Ubuntu</text>
  <text x="750" y="190" text-anchor="middle" fill="#94a3b8" font-size="14">allowlisted task</text>

  <rect x="930" y="125" width="220" height="92" rx="18" fill="#111827" stroke="#4ade80" stroke-width="3"/>
  <text x="1040" y="160" text-anchor="middle" fill="#dcfce7" font-size="20" font-weight="700">verify result</text>
  <text x="1040" y="190" text-anchor="middle" fill="#94a3b8" font-size="14">job · location · digest</text>
</g>
<g stroke="#475569" stroke-width="4" fill="none">
  <path d="M280 171 H350"/><path d="M570 171 H640"/><path d="M860 171 H930"/>
</g>
<text x="1140" y="282" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">If the remote side fails, pretending Windows did it is not “resilience.”</text>
</svg>